<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | User Reports</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>

<body>


<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="admin-index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="admin-index.html"
                    class="nav-link"
            >
                Dashboard
            </a>

            <a
                    href="admin-profile.html"
                    class="nav-link"
            >
                Profile
            </a>

            <a
                    href="admin-tickets.html"
                    class="nav-link"
            >
                Tickets
            </a>

            <a
                    href="admin-reports.html"
                    class="nav-link active"
            >
                Reports
            </a>

        </nav>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="page-container">


    <div class="page-header">

        <h1>
            User Reports
        </h1>

        <p>
            View and manage reports submitted by users.
        </p>

    </div>


    <!-- ================= FILTERS ================= -->

    <div class="report-filters">
        <select id="statusFilter" class="status-select">
            <option value="ALL">All Reports</option>
            <option value="PENDING">Pending</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="RESOLVED">Resolved</option>
            <option value="CLOSED">Closed</option>
        </select>
    </div>


    <!-- ================= LOADING ================= -->

    <div id="reportsLoading" style="text-align: center; padding: 2rem;">
        Loading reports...
    </div>


    <!-- ================= REPORT LIST ================= -->

    <section id="reportsList" class="reports-list">

        <!-- Reports are generated by JavaScript -->

    </section>


    <!-- ================= NO REPORTS ================= -->

    <div id="noReports" class="no-search-results" style="display: none;">

        <h2>
            No Reports Found
        </h2>

        <p>
            No reports match the current filter.
        </p>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/admin-reports.js"></script>


</body>

</html>
