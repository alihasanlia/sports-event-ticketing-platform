<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | My Profile</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="index.html"
                class="logo"
        >
            PlayTix
        </a>

        <nav class="main-nav">

            <a
                    href="index.html"
                    class="nav-link"
            >
                Home
            </a>

            <a
                    href="profile.html"
                    class="nav-link active"
            >
                Profile
            </a>

            <a
                    href="reservations.html"
                    class="nav-link"
            >
                Reservations
            </a>

            <a
                    href="tickets.html"
                    class="nav-link"
            >
                Tickets
            </a>

            <a
                    href="reports.html"
                    class="nav-link"
            >
                Reports
            </a>

        </nav>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="page-container user-profile-page">


    <!-- ================= WALLET ================= -->

    <section class="wallet-card">

        <h3>
            Wallet Balance
        </h3>

        <h1 id="walletBalance">
            -
        </h1>

    </section>


    <!-- ================= PROFILE ================= -->

    <section class="profile-card">

        <div class="profile-image">

            <img
                    id="profileImage"
                    src="assets/images/default-profile.jpg"
                    alt="Profile Picture"
            >

        </div>

        <h2 id="fullName">
            Loading...
        </h2>

        <p
                class="profile-role"
                id="profileRole"
        >
            USER
        </p>

    </section>


    <!-- ================= USER INFORMATION ================= -->

    <section class="info-card user-info-card">

        <div class="section-title">

            <div>

                <h3>
                    User Information
                </h3>

                <p>
                    View and edit your account information.
                </p>

            </div>

        </div>


        <!-- ERROR MESSAGE -->

        <div
                id="errorMessage"
                class="profile-save-message"
                style="display: none;"
        ></div>


        <form id="userProfileForm">


            <!-- ================= USER ID ================= -->

            <div class="profile-form-row">

                <label for="userId">
                    User ID
                </label>

                <input
                        type="text"
                        id="userId"
                        name="user_id"
                        readonly
                >

            </div>


            <!-- ================= FIRST NAME ================= -->

            <div class="profile-form-row">

                <label for="firstName">
                    First Name
                </label>

                <input
                        type="text"
                        id="firstName"
                        name="first_name"
                        required
                        minlength="2"
                        maxlength="50"
                >

            </div>


            <!-- ================= LAST NAME ================= -->

            <div class="profile-form-row">

                <label for="lastName">
                    Last Name
                </label>

                <input
                        type="text"
                        id="lastName"
                        name="last_name"
                        required
                        minlength="2"
                        maxlength="50"
                >

            </div>


            <!-- ================= EMAIL ================= -->

            <div class="profile-form-row">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        readonly
                >

            </div>


            <!-- ================= PHONE ================= -->

            <div class="profile-form-row">

                <label for="phoneNumber">
                    Phone Number
                </label>

                <input
                        type="text"
                        id="phoneNumber"
                        name="phone_number"
                        placeholder="09123456789"
                        pattern="09[0-9]{9}"
                >

            </div>


            <!-- ================= CITY ================= -->

            <div class="profile-form-row">

                <label for="city">
                    City
                </label>

                <input
                        type="text"
                        id="city"
                        name="city"
                        minlength="2"
                        maxlength="20"
                >

            </div>


            <!-- ================= REGISTRATION DATE ================= -->

            <div class="profile-form-row">

                <label for="registrationDate">
                    Registration Date
                </label>

                <input
                        type="text"
                        id="registrationDate"
                        name="registration_date"
                        readonly
                >

            </div>


            <!-- ================= ACCOUNT STATUS ================= -->

            <div class="profile-form-row">

                <label for="accountStatus">
                    Account Status
                </label>

                <input
                        type="text"
                        id="accountStatus"
                        name="account_status"
                        value="ACTIVE"
                        readonly
                >

            </div>


            <!-- ================= ROLE ================= -->

            <div class="profile-form-row">

                <label for="role">
                    Role
                </label>

                <input
                        type="text"
                        id="role"
                        name="role"
                        value="USER"
                        readonly
                >

            </div>


            <!-- ================= ACTIONS ================= -->

            <div class="profile-actions">

                <button
                        type="submit"
                        id="saveChangesBtn"
                        class="primary-btn"
                >
                    Save Changes
                </button>

                <button
                        type="button"
                        id="cancelEditBtn"
                        class="secondary-btn"
                >
                    Cancel
                </button>

            </div>

        </form>


        <!-- ================= SAVE MESSAGE ================= -->

        <div
                id="saveMessage"
                class="profile-save-message"
                style="display: none;"
        >
            Changes saved successfully.
        </div>

    </section>


    <!-- ================= MENU ================= -->

    <section class="menu-grid">


        <a
                href="tickets.html"
                class="menu-card"
        >

            <div class="menu-icon">
                🎟
            </div>

            <h3>
                Tickets
            </h3>

            <p>
                View your purchased tickets
            </p>

        </a>


        <a
                href="reports.html"
                class="menu-card"
        >

            <div class="menu-icon">
                ⚠
            </div>

            <h3>
                Reports
            </h3>

            <p>
                View or submit reports
            </p>

        </a>


    </section>


    <!-- ================= LOGOUT ================= -->

    <section class="logout-section">

        <button
                id="logoutBtn"
                class="logout-btn"
        >
            Logout
        </button>

    </section>


</main>


<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script src="js/profile.js"></script>

</body>

</html>
