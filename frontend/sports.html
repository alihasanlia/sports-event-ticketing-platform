<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | Sport</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>
<body>
<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="index.html"
                    class="nav-link"
            >
                Home
            </a>

            <a
                    href="profile.html"
                    class="nav-link"
            >
                Profile
            </a>

            <a
                    href="tickets.html"
                    class="nav-link"
            >
                Tickets
            </a>

            <a
                    href="reports.html"
                    class="nav-link"
            >
                Reports
            </a>

        </nav>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="page-container">


    <!-- ================= PAGE TITLE ================= -->

    <div class="page-header">

        <div>

            <h1 id="sportTitle">
                Loading...
            </h1>

            <p id="sportDescription">
                Browse stadiums and leagues for this sport.
            </p>

        </div>

    </div>


    <!-- ================= TOGGLE ================= -->

    <div class="sport-toggle">

        <button
                type="button"
                class="sport-toggle-btn active"
                data-view="stadiums"
        >
            Stadiums
        </button>


        <button
                type="button"
                class="sport-toggle-btn"
                data-view="leagues"
        >
            Leagues / Tournaments
        </button>

    </div>


    <!-- ================= LOADING ================= -->

    <div id="sportLoading" style="text-align: center; padding: 2rem;">
        Loading...
    </div>


    <!-- =====================================================
         STADIUMS
    ====================================================== -->

    <section
            id="stadiumsView"
            class="sport-items-view active"
    >

        <div id="stadiumsGrid" class="sport-items-grid">

            <!-- Stadiums are generated by JavaScript -->

        </div>

    </section>



    <!-- =====================================================
         LEAGUES / TOURNAMENTS
    ====================================================== -->

    <section
            id="leaguesView"
            class="sport-items-view"
    >

        <div id="leaguesGrid" class="sport-items-grid">

            <!-- Leagues are generated by JavaScript -->

        </div>

    </section>



    <!-- ================= NO RESULTS ================= -->

    <div
            id="noItems"
            class="no-search-results"
            style="display: none;"
    >

        <h2>
            Nothing found
        </h2>

        <p>
            There are currently no available stadiums or leagues.
        </p>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/sports.js"></script>

</body>
</html>
