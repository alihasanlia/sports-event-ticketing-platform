<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlayTix | My Reports</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a href="index.html" class="logo">
            PlayTix
        </a>

        <nav class="main-nav">

            <a href="index.html" class="nav-link">
                Home
            </a>

            <a href="profile.html" class="nav-link">
                Profile
            </a>

            <a href="reports.html" class="nav-link active">
                Reports
            </a>

        </nav>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="page-container">

    <!-- Page Header -->

    <div class="page-header report-page-header">

        <div>

            <h1>My Reports</h1>

            <p>
                View your previous reports and their responses.
            </p>

        </div>

        <button
                id="addReportBtn"
                class="primary-btn add-report-btn"
        >
            + Add New Report
        </button>

    </div>


    <!-- ================= NEW REPORT FORM ================= -->

    <section
            id="newReportForm"
            class="new-report-card"
            style="display: none;"
    >

        <div class="form-header">

            <h2>Create New Report</h2>

            <button
                    type="button"
                    id="closeReportForm"
                    class="close-btn"
            >
                ×
            </button>

        </div>


        <form id="reportForm">

            <!-- Subject -->

            <div class="form-group">

                <label for="reportSubject">
                    Subject
                </label>

                <select
                        id="reportSubject"
                        name="subject"
                        required
                >
                    <option value="">Select subject</option>
                    <option value="PAYMENT">Payment Problem</option>
                    <option value="TICKET_CANCELLATION">Ticket Cancellation</option>
                    <option value="REFUND">Refund Issue</option>
                    <option value="TICKET_DELIVERY">Ticket Delivery</option>
                    <option value="OTHER">Other</option>
                </select>

            </div>


            <!-- Text -->

            <div class="form-group">

                <label for="reportText">
                    Report
                </label>

                <textarea
                        id="reportText"
                        name="text"
                        rows="6"
                        placeholder="Describe your problem..."
                        required
                ></textarea>

            </div>


            <button
                    type="submit"
                    class="primary-btn submit-report-btn"
            >
                Submit Report
            </button>

        </form>

    </section>


    <!-- ================= LOADING ================= -->

    <div id="reportsLoading" style="text-align: center; padding: 2rem;">
        Loading reports...
    </div>


    <!-- ================= REPORT LIST ================= -->

    <section id="reportsList" class="reports-list">

        <!-- Reports are generated by JavaScript -->

    </section>


    <!-- ================= NO REPORTS ================= -->

    <div id="noReports" class="no-search-results" style="display: none;">

        <h2>
            No Reports
        </h2>

        <p>
            You haven't submitted any reports yet.
        </p>

    </div>


</main>


<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script src="js/reports.js"></script>

</body>

</html>
