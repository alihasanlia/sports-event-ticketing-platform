<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | My Tickets</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="index.html"
                    class="nav-link"
            >
                Home
            </a>

            <a
                    href="profile.html"
                    class="nav-link"
            >
                Profile
            </a>

            <a
                    href="tickets.html"
                    class="nav-link active"
            >
                Tickets
            </a>

            <a
                    href="reports.html"
                    class="nav-link"
            >
                Reports
            </a>

        </nav>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="page-container">


    <div class="page-header">

        <div>

            <h1>
                My Tickets
            </h1>

            <p>
                View and manage all your tickets.
            </p>

        </div>

    </div>


    <!-- ================= LOADING ================= -->

    <div id="ticketsLoading" style="text-align: center; padding: 2rem;">
        Loading tickets...
    </div>


    <!-- ================= TICKET LIST ================= -->

    <section id="ticketsList" class="ticket-list">

        <!-- Tickets are generated by JavaScript -->

    </section>


    <!-- ================= NO TICKETS ================= -->

    <div id="noTickets" class="no-search-results" style="display: none;">

        <h2>
            No Tickets
        </h2>

        <p>
            You haven't purchased any tickets yet.
        </p>

        <a
                href="index.html"
                class="primary-btn"
        >
            Browse Matches
        </a>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/tickets.js"></script>

</body>

</html>
