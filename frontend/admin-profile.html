<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | Admin Profile</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>
<body>

<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="admin-index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="admin-index.html"
                    class="nav-link"
            >
                Dashboard
            </a>

            <a
                    href="admin-profile.html"
                    class="nav-link active"
            >
                Admin Profile
            </a>

        </nav>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="page-container admin-profile-page">


    <!-- ================= PROFILE ================= -->

    <section class="profile-card">

        <div class="profile-image">

            <img
                    src="assets/images/default-profile.jpg"
                    alt="Profile Picture"
            >

        </div>


        <h2 id="fullName">
            Mohammad Ahmadi
        </h2>


        <p class="profile-role">
            Administrator
        </p>

    </section>



    <!-- ================= ADMIN INFORMATION ================= -->

    <section class="info-card admin-info-card">

        <div class="section-title">

            <div>

                <h3>
                    Administrator Information
                </h3>

                <p>
                    View and edit your account information.
                </p>

            </div>

        </div>



        <form id="adminProfileForm">


            <!-- ================= USER ID ================= -->

            <div class="profile-form-row">

                <label for="userId">
                    User ID
                </label>

                <input
                        type="number"
                        id="userId"
                        name="user_id"
                        value="1"
                        readonly
                >

            </div>



            <!-- ================= FIRST NAME ================= -->

            <div class="profile-form-row">

                <label for="firstName">
                    First Name
                </label>

                <input
                        type="text"
                        id="firstName"
                        name="first_name"
                        value="Mohammad"
                        required
                >

            </div>



            <!-- ================= LAST NAME ================= -->

            <div class="profile-form-row">

                <label for="lastName">
                    Last Name
                </label>

                <input
                        type="text"
                        id="lastName"
                        name="last_name"
                        value="Ahmadi"
                        required
                >

            </div>



            <!-- ================= EMAIL ================= -->

            <div class="profile-form-row">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        value="admin@example.com"
                        required
                >

            </div>



            <!-- ================= PHONE ================= -->

            <div class="profile-form-row">

                <label for="phoneNumber">
                    Phone Number
                </label>

                <input
                        type="text"
                        id="phoneNumber"
                        name="phone_number"
                        value="+98 912 123 4567"
                        required
                >

            </div>



            <!-- ================= PASSWORD ================= -->

            <div class="profile-form-row">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            value="password123"
                            required
                    >

                    <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>

            </div>



            <!-- ================= REGISTRATION DATE ================= -->

            <div class="profile-form-row">

                <label for="registrationDate">
                    Registration Date
                </label>

                <input
                        type="date"
                        id="registrationDate"
                        name="registration_date"
                        value="2026-01-01"
                        readonly
                >

            </div>



            <!-- ================= ACCOUNT STATUS ================= -->

            <div class="profile-form-row">

                <label for="accountStatus">
                    Account Status
                </label>

                <input
                        type="text"
                        id="accountStatus"
                        name="account_status"
                        value="ACTIVE"
                        readonly
                >

            </div>



            <!-- ================= ROLE ================= -->

            <div class="profile-form-row">

                <label for="role">
                    Role
                </label>

                <input
                        type="text"
                        id="role"
                        name="role"
                        value="ADMIN"
                        readonly
                >

            </div>



            <!-- ================= ACTIONS ================= -->

            <div class="profile-actions">

                <button
                        type="submit"
                        class="primary-btn"
                >
                    Save Changes
                </button>


                <button
                        type="button"
                        id="cancelEditBtn"
                        class="secondary-btn"
                >
                    Cancel
                </button>

            </div>


        </form>



        <!-- ================= SUCCESS MESSAGE ================= -->

        <div
                id="saveMessage"
                class="profile-save-message"
                style="display: none;"
        >
            Changes saved successfully.
        </div>


    </section>



    <!-- ================= LOGOUT ================= -->

    <section class="logout-section">

        <button
                id="logoutBtn"
                class="logout-btn"
        >
            Logout
        </button>

    </section>


</main>



<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>


    /* =====================================================
       PROFILE FORM
    ===================================================== */

    const profileForm =
        document.getElementById(
            "adminProfileForm"
        );


    const saveMessage =
        document.getElementById(
            "saveMessage"
        );


    const cancelEditBtn =
        document.getElementById(
            "cancelEditBtn"
        );



    /* =====================================================
       STORE ORIGINAL VALUES
    ===================================================== */

    const editableInputs =
        profileForm.querySelectorAll(
            "input:not([readonly])"
        );


    const originalValues = {};


    editableInputs.forEach(
        function (input) {

            originalValues[
                input.name
                ] = input.value;

        }
    );



    /* =====================================================
       SAVE CHANGES
    ===================================================== */

    profileForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            /*
             * Temporary local behavior.
             *
             * Later this section will send
             * the edited information to
             * the Spring Boot API.
             */


            editableInputs.forEach(
                function (input) {

                    originalValues[
                        input.name
                        ] = input.value;

                }
            );


            saveMessage.style.display =
                "block";


            setTimeout(
                function () {

                    saveMessage.style.display =
                        "none";

                },
                3000
            );

        }
    );



    /* =====================================================
       CANCEL EDIT
    ===================================================== */

    cancelEditBtn.addEventListener(
        "click",
        function () {

            editableInputs.forEach(
                function (input) {

                    input.value =
                        originalValues[
                            input.name
                            ];

                }
            );


            saveMessage.style.display =
                "none";

        }
    );



    /* =====================================================
       UPDATE FULL NAME
    ===================================================== */

    const firstName =
        document.getElementById(
            "firstName"
        );


    const lastName =
        document.getElementById(
            "lastName"
        );


    const fullName =
        document.getElementById(
            "fullName"
        );


    function updateFullName() {

        fullName.textContent =
            firstName.value +
            " " +
            lastName.value;

    }


    firstName.addEventListener(
        "input",
        updateFullName
    );


    lastName.addEventListener(
        "input",
        updateFullName
    );



    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            function () {

                /*
                 * Later we can clear the
                 * authentication/session data here.
                 */

                window.location.href =
                    "login.html";

            }
        );

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    togglePassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type = "text";

                togglePassword.textContent = "👁️";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "👁️";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }

    );

</script>

</body>
</html>
