<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | Admin Profile</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="main-header">

    <div class="header-content">

        <a
                href="admin-index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="admin-index.html"
                    class="nav-link"
            >
                Dashboard
            </a>

            <a
                    href="admin-profile.html"
                    class="nav-link active"
            >
                Admin Profile
            </a>

        </nav>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="page-container admin-profile-page">


    <!-- =================================================
         PROFILE CARD
    ================================================== -->

    <section class="profile-card">

        <div class="profile-image">

            <img
                    id="profileImage"
                    src="assets/images/default-profile.jpg"
                    alt="Profile Picture"
            >

        </div>


        <h2 id="fullName">
            Loading...
        </h2>


        <p class="profile-role">
            Administrator
        </p>

    </section>



    <!-- =================================================
         ADMIN INFORMATION
    ================================================== -->

    <section class="info-card admin-info-card">


        <div class="section-title">

            <div>

                <h3>
                    Administrator Information
                </h3>

                <p>
                    View and edit your account information.
                </p>

            </div>

        </div>



        <!-- =================================================
             ERROR MESSAGE
        ================================================== -->

        <div
                id="errorMessage"
                class="profile-save-message"
                style="display: none;"
        ></div>



        <!-- =================================================
             PROFILE FORM
        ================================================== -->

        <form id="adminProfileForm">


            <!-- ================= USER ID ================= -->

            <div class="profile-form-row">

                <label for="userId">
                    User ID
                </label>

                <input
                        type="text"
                        id="userId"
                        name="user_id"
                        readonly
                >

            </div>



            <!-- ================= FIRST NAME ================= -->

            <div class="profile-form-row">

                <label for="firstName">
                    First Name
                </label>

                <input
                        type="text"
                        id="firstName"
                        name="first_name"
                        required
                        minlength="2"
                        maxlength="50"
                >

            </div>



            <!-- ================= LAST NAME ================= -->

            <div class="profile-form-row">

                <label for="lastName">
                    Last Name
                </label>

                <input
                        type="text"
                        id="lastName"
                        name="last_name"
                        required
                        minlength="2"
                        maxlength="50"
                >

            </div>



            <!-- ================= EMAIL ================= -->

            <div class="profile-form-row">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        readonly
                >

            </div>



            <!-- ================= PHONE ================= -->

            <div class="profile-form-row">

                <label for="phoneNumber">
                    Phone Number
                </label>

                <input
                        type="text"
                        id="phoneNumber"
                        name="phone_number"
                        placeholder="09123456789"
                >

            </div>



            <!-- ================= CITY ================= -->

            <div class="profile-form-row">

                <label for="city">
                    City
                </label>

                <input
                        type="text"
                        id="city"
                        name="city"
                        minlength="2"
                        maxlength="20"
                >

            </div>



            <!-- ================= REGISTRATION DATE ================= -->

            <div class="profile-form-row">

                <label for="registrationDate">
                    Registration Date
                </label>

                <input
                        type="text"
                        id="registrationDate"
                        name="registration_date"
                        readonly
                >

            </div>



            <!-- ================= ROLE ================= -->

            <div class="profile-form-row">

                <label for="role">
                    Role
                </label>

                <input
                        type="text"
                        id="role"
                        name="role"
                        value="ADMIN"
                        readonly
                >

            </div>



            <!-- =================================================
                 ACTIONS
            ================================================== -->

            <div class="profile-actions">

                <button
                        type="submit"
                        id="saveChangesBtn"
                        class="primary-btn"
                >
                    Save Changes
                </button>


                <button
                        type="button"
                        id="cancelEditBtn"
                        class="secondary-btn"
                >
                    Cancel
                </button>

            </div>


        </form>



        <!-- =================================================
             SUCCESS MESSAGE
        ================================================== -->

        <div
                id="saveMessage"
                class="profile-save-message"
                style="display: none;"
        >
            Changes saved successfully.
        </div>


    </section>



    <!-- =================================================
         LOGOUT
    ================================================== -->

    <section class="logout-section">

        <button
                id="logoutBtn"
                class="logout-btn"
        >
            Logout
        </button>

    </section>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/admin-profile.js"></script>

</body>

</html>
