<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | My Reservations</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="index.html"
                    class="nav-link"
            >
                Home
            </a>

            <a
                    href="profile.html"
                    class="nav-link"
            >
                Profile
            </a>

            <a
                    href="reservations.html"
                    class="nav-link active"
            >
                Reservations
            </a>

            <a
                    href="tickets.html"
                    class="nav-link"
            >
                Tickets
            </a>

            <a
                    href="reports.html"
                    class="nav-link"
            >
                Reports
            </a>

        </nav>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="page-container">


    <div class="page-header">

        <div>

            <h1>
                My Reservations
            </h1>

            <p>
                View your reserved tickets and complete your payments.
            </p>

        </div>

    </div>


    <!-- ================= LOADING ================= -->

    <div id="reservationsLoading" style="text-align: center; padding: 2rem;">
        Loading reservations...
    </div>


    <!-- ================= RESERVATIONS ================= -->

    <section
            id="reservationsList"
            class="ticket-list"
    >

        <!-- Reservations are generated by JavaScript -->

    </section>


    <!-- ================= EMPTY STATE ================= -->

    <div
            id="emptyReservations"
            class="no-search-results"
            style="display: none;"
    >

        <h2>
            No Reservations
        </h2>

        <p>
            You don't have any reserved tickets yet.
        </p>


        <a
                href="index.html"
                class="primary-btn"
        >
            Browse Tickets
        </a>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/reservations.js"></script>

</body>

</html>
