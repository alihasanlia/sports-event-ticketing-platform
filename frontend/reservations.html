<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlayTix | My Reservations</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="main-header">

    <div class="header-content">

        <a
                href="index.html"
                class="logo"
        >
            PlayTix
        </a>


        <nav class="main-nav">

            <a
                    href="index.html"
                    class="nav-link"
            >
                Home
            </a>

            <a
                    href="profile.html"
                    class="nav-link"
            >
                Profile
            </a>

            <a
                    href="reservations.html"
                    class="nav-link active"
            >
                Reservations
            </a>

            <a
                    href="tickets.html"
                    class="nav-link"
            >
                Tickets
            </a>

            <a
                    href="reports.html"
                    class="nav-link"
            >
                Reports
            </a>

        </nav>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="page-container">


    <div class="page-header">

        <div>

            <h1>
                My Reservations
            </h1>

            <p>
                View your reserved tickets and complete your payments.
            </p>

        </div>

    </div>



    <!-- ================= RESERVATIONS ================= -->

    <section
            id="reservationsList"
            class="ticket-list"
    >

        <!-- Reservations are generated by JavaScript -->

    </section>



    <!-- ================= EMPTY STATE ================= -->

    <div
            id="emptyReservations"
            class="no-search-results"
            style="display: none;"
    >

        <h2>
            No Reservations
        </h2>

        <p>
            You don't have any reserved tickets yet.
        </p>


        <a
                href="index.html"
                class="primary-btn"
        >
            Browse Tickets
        </a>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer class="main-footer">

    <p>
        © 2026 PlayTix. All Rights Reserved.
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>


    /* =====================================================
       LOAD RESERVATIONS
    ===================================================== */

    let reservations =
        JSON.parse(
            localStorage.getItem(
                "reservations"
            )
        ) || [];



    const reservationsList =
        document.getElementById(
            "reservationsList"
        );


    const emptyReservations =
        document.getElementById(
            "emptyReservations"
        );



    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(dateString) {

        const date =
            new Date(dateString);


        return date.toLocaleString(
            "en-US",
            {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }



    /* =====================================================
       DISPLAY RESERVATIONS
    ===================================================== */

    function displayReservations() {


        reservationsList.innerHTML = "";



        if (reservations.length === 0) {

            reservationsList.style.display =
                "none";

            emptyReservations.style.display =
                "block";

            return;

        }



        reservationsList.style.display =
            "flex";

        emptyReservations.style.display =
            "none";



        reservations.forEach(
            function (reservation, index) {


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "ticket-card";



                const paymentStatus =
                    reservation.paid
                        ? "PAID"
                        : "UNPAID";



                const paymentClass =
                    reservation.paid
                        ? "status-paid"
                        : "status-pending";



                card.innerHTML = `

                    <div class="ticket-header">

                        <div>

                            <h2>
                                ${reservation.match}
                            </h2>

                            <p class="ticket-id">
                                Match ID:
                                ${reservation.matchId}
                            </p>

                        </div>


                        <span
                            class="status-badge ${paymentClass}"
                        >
                            ${paymentStatus}
                        </span>

                    </div>



                    <div class="ticket-info">


                        <div class="ticket-info-item">

                            <span class="info-label">
                                Stadium
                            </span>

                            <span>
                                ${reservation.stadium}
                            </span>

                        </div>



                        <div class="ticket-info-item">

                            <span class="info-label">
                                Ticket Category
                            </span>

                            <span>
                                ${reservation.ticketCategory}
                            </span>

                        </div>



                        <div class="ticket-info-item">

                            <span class="info-label">
                                Price
                            </span>

                            <span>
                                ${Number(
                    reservation.price
                ).toLocaleString()}
                                Toman
                            </span>

                        </div>



                        <div class="ticket-info-item">

                            <span class="info-label">
                                Reservation Time
                            </span>

                            <span>
                                ${formatDate(
                    reservation.reservationTime
                )}
                            </span>

                        </div>


                    </div>



                    <div class="ticket-footer">


                        <div>

                            <span class="info-label">
                                Payment Status
                            </span>

                            <strong>
                                ${paymentStatus}
                            </strong>

                        </div>



                        ${
                    reservation.paid

                        ?

                        `
                            <span class="paid-label">
                                Payment Completed
                            </span>
                            `

                        :

                        `
                            <a
                                href="payment.html?reservation=${index}"
                                class="primary-btn"
                            >
                                Pay
                            </a>
                            `

                }


                    </div>

                `;


                reservationsList.appendChild(
                    card
                );

            }
        );

    }



    displayReservations();


</script>

</body>

</html>
